<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:var(--vscode-font-family,-apple-system,sans-serif);
            font-size:var(--vscode-font-size,13px);
            background:var(--vscode-editor-background,#1e1e1e);
            color:var(--vscode-editor-foreground,#d4d4d4);
            height:100vh;display:flex;flex-direction:column
        }
        .header{
            padding:12px 16px;
            background:var(--vscode-titleBar-activeBackground,#252526);
            border-bottom:1px solid var(--vscode-panel-border,#3c3c3c);
            font-weight:600;font-size:14px;
            display:flex;align-items:center;gap:8px
        }
        .header .dot{width:8px;height:8px;border-radius:50%;background:#4ec944}
        .header .dot.disconnected{background:#f44747}
        #messages{flex:1;overflow-y:auto;padding:16px}
        .message{margin-bottom:16px;max-width:90%}
        .message.user{margin-left:auto}
        .message .bubble{
            padding:10px 14px;border-radius:12px;line-height:1.5;
            white-space:pre-wrap;word-break:break-word
        }
        .message.user .bubble{
            background:var(--vscode-button-background,#0e639c);
            color:var(--vscode-button-foreground,white);
            border-bottom-right-radius:4px
        }
        .message.ai .bubble{
            background:var(--vscode-input-background,#3c3c3c);
            border:1px solid var(--vscode-input-border,#555);
            border-bottom-left-radius:4px
        }
        .message.error .bubble{
            background:#5a1d1d;color:#ff8888;border:1px solid #f44747
        }
        .message .label{font-size:11px;margin-bottom:4px;opacity:0.7;padding:0 4px}
        .message.user .label{text-align:right}
        pre{
            background:var(--vscode-textCodeBlock-background,#1e1e1e);
            padding:12px;border-radius:6px;overflow-x:auto;
            margin:8px 0;font-family:var(--vscode-editor-font-family,monospace)
        }
        code{font-family:var(--vscode-editor-font-family,monospace)}
        #inputArea{display:flex;gap:8px;padding:12px 16px;
            border-top:1px solid var(--vscode-panel-border,#3c3c3c);
            background:var(--vscode-editor-background,#1e1e1e)}
        #input{
            flex:1;padding:10px 14px;
            background:var(--vscode-input-background,#3c3c3c);
            color:var(--vscode-input-foreground,white);
            border:1px solid var(--vscode-input-border,#555);
            border-radius:8px;resize:none;font-family:inherit;font-size:inherit
        }
        #input:focus{outline:1px solid var(--vscode-focusBorder,#007acc)}
        #sendBtn{
            padding:10px 16px;
            background:var(--vscode-button-background,#0e639c);
            color:var(--vscode-button-foreground,white);
            border:none;border-radius:8px;cursor:pointer;
            font-weight:600;font-size:inherit
        }
        #sendBtn:hover{background:var(--vscode-button-hoverBackground,#1177bb)}
        #sendBtn:disabled{opacity:0.5;cursor:not-allowed}
        .typing{padding:8px 16px;font-style:italic;opacity:0.6;font-size:12px}
        .cancelBtn{
            padding:4px 12px;margin-left:8px;
            background:transparent;color:#ff8888;
            border:1px solid #f44747;border-radius:4px;
            cursor:pointer;font-size:11px
        }
    </style>
</head>
<body>
    <div class="header"><span class="dot" id="statusDot"></span>CodeForge Chat</div>
    <div id="messages"></div>
    <div class="typing" id="typing" style="display:none">
        AI is thinking... <button class="cancelBtn" id="cancelBtn" style="display:none">Cancel</button>
    </div>
    <div id="inputArea">
        <textarea id="input" rows="2" placeholder="Ask anything about your code..."></textarea>
        <button id="sendBtn">Send</button>
    </div>
    <script>
        var vscode = acquireVsCodeApi();
        var messages = document.getElementById('messages');
        var input = document.getElementById('input');
        var sendBtn = document.getElementById('sendBtn');
        var typing = document.getElementById('typing');
        var cancelBtn = document.getElementById('cancelBtn');
        var dot = document.getElementById('statusDot');
        var currentAiBubble = null;
        var abortController = null;

        sendBtn.addEventListener('click', send);
        cancelBtn.addEventListener('click', cancel);
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });

        function send() {
            var text = input.value.trim();
            if (!text) return;
            addBubble(text, 'user', 'You');
            input.value = '';
            sendBtn.disabled = true;
            typing.style.display = 'block';
            cancelBtn.style.display = 'inline-block';
            dot.className = 'dot';
            currentAiBubble = null;
            vscode.postMessage({ command: 'sendMessage', text: text });
        }

        function cancel() {
            vscode.postMessage({ command: 'cancelRequest' });
            typing.style.display = 'none';
            cancelBtn.style.display = 'none';
            sendBtn.disabled = false;
            if (currentAiBubble && !currentAiBubble.textContent.trim()) {
                currentAiBubble.textContent = '[Cancelled]';
            }
            currentAiBubble = null;
        }

        window.addEventListener('message', function(event) {
            var msg = event.data;
            switch(msg.command) {
                case 'responseStart':
                    currentAiBubble = addBubble('', 'ai', 'CodeForge');
                    break;
                case 'responseChunk':
                    if (currentAiBubble) {
                        currentAiBubble.textContent += msg.text;
                        messages.scrollTop = messages.scrollHeight;
                    }
                    typing.style.display = 'none';
                    cancelBtn.style.display = 'none';
                    break;
                case 'responseDone':
                    sendBtn.disabled = false;
                    input.focus();
                    currentAiBubble = null;
                    cancelBtn.style.display = 'none';
                    break;
                case 'responseError':
                    addBubble(msg.error, 'error', 'Error');
                    sendBtn.disabled = false;
                    typing.style.display = 'none';
                    cancelBtn.style.display = 'none';
                    dot.className = 'dot disconnected';
                    break;
                case 'addMessage':
                    var cls = msg.type === 'user' ? 'user' : msg.type === 'error' ? 'error' : 'ai';
                    addBubble(msg.text, cls, cls === 'user' ? 'You' : 'CodeForge');
                    break;
            }
        });

        function addBubble(text, type, label) {
            var div = document.createElement('div');
            div.className = 'message ' + type;
            div.innerHTML = '<div class="label">' + label + '</div><div class="bubble">' + formatText(text) + '</div>';
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div.querySelector('.bubble');
        }

        function formatText(text) {
            var html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            html = html.replace(/\n/g, '<br>');
            return html;
        }
    </script>
</body>
</html>
