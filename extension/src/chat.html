<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'unsafe-inline' https://cdnjs.cloudflare.com;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg: var(--vscode-editor-background, #1e1e1e);
            --fg: var(--vscode-editor-foreground, #d4d4d4);
            --border: var(--vscode-panel-border, #3c3c3c);
            --input-bg: var(--vscode-input-background, #2d2d2d);
            --input-fg: var(--vscode-input-foreground, #fff);
            --input-border: var(--vscode-input-border, #555);
            --btn-bg: var(--vscode-button-background, #0e639c);
            --btn-hover: var(--vscode-button-hoverBackground, #1177bb);
            --btn-secondary: var(--vscode-button-secondaryBackground, #3c3c3c);
            --btn-secondary-hover: var(--vscode-button-secondaryHoverBackground, #4d4d4d);
            --focus: var(--vscode-focusBorder, #1f6feb);
            --muted: var(--vscode-descriptionForeground, #999);
            --code-bg: var(--vscode-textCodeBlock-background, #1a1a1a);
            --status-bg: var(--vscode-statusBar-background, #007acc);
            --status-fg: var(--vscode-statusBar-foreground, #fff);
            --radius: 6px;
            --font: var(--vscode-font-family, -apple-system, sans-serif);
            --mono: var(--vscode-editor-font-family, 'SF Mono', Monaco, monospace);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--font);font-size:13px;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column;overflow:hidden}

        /* Status Bar */
        .statusbar{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--status-bg);color:var(--status-fg);font-size:11px;flex-shrink:0;height:26px;user-select:none}
        .statusbar .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}.dot.on{background:#4ec944}.dot.off{background:#f85149}
        .statusbar .spacer{flex:1}

        /* Content */
        .content{flex:1;overflow-y:auto;scroll-behavior:smooth}
        
        /* Dashboard */
        .dashboard{padding:16px}
        .dashboard h3{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--fg)}
        .dash-cards{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
        .dash-card{flex:1;min-width:130px;padding:10px 14px;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius)}
        .dash-card .lbl{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:0.5px;margin-bottom:4px}
        .dash-card .val{font-size:14px;font-weight:500}.dash-card .val.green{color:#4ec944}
        .quick-actions{display:flex;gap:6px;flex-wrap:wrap}
        .quick-actions button{padding:5px 12px;font-size:11px;background:var(--btn-secondary);color:var(--fg);border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:all .12s;font-family:var(--font)}
        .quick-actions button:hover{background:var(--btn-secondary-hover);border-color:var(--focus)}

        /* Messages */
        .msg{border-bottom:1px solid rgba(128,128,128,0.08)}
        .msg.user{padding:8px 16px;font-size:12px;color:var(--muted)}
        .msg.user .q{color:var(--fg);font-weight:500}
        .msg.error{padding:10px 16px;background:rgba(248,81,73,0.1);color:#f99;font-size:12px}

        /* Sections */
        .sec{border-bottom:1px solid rgba(128,128,128,0.06)}
        .sec-hdr{padding:7px 16px;font-size:10px;font-weight:600;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between;align-items:center;letter-spacing:0.5px;user-select:none}
        .sec-hdr:hover{background:rgba(255,255,255,0.02)}
        .sec-body{padding:0 16px 8px}.sec-body.hidden{display:none}
        .text{padding:10px 16px;line-height:1.6}

        /* Code Block */
        .cb{border:1px solid var(--border);border-left:3px solid var(--focus);border-radius:4px;overflow:hidden;margin:6px 0}
        .cb-bar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:rgba(255,255,255,0.03);font-size:10px;color:var(--muted)}
        .cb-bar button{padding:2px 8px;font-size:10px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:3px;cursor:pointer;font-family:var(--font)}
        .cb-bar button:hover{color:var(--fg);background:rgba(255,255,255,0.05)}
        .cb pre{margin:0;padding:12px;overflow-x:auto;background:var(--code-bg)}
        .cb code{font-family:var(--mono);font-size:12px;line-height:1.5;tab-size:4}

        /* Actions */
        .acts{display:flex;gap:5px;padding:6px 16px 10px;flex-wrap:wrap}
        .acts button{padding:5px 12px;font-size:11px;background:var(--btn-secondary);color:var(--fg);border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:all .12s;font-family:var(--font)}
        .acts button:hover{background:var(--btn-secondary-hover)}
        .acts button.pri{background:var(--btn-bg);color:#fff;border:none}
        .acts button.pri:hover{background:var(--btn-hover)}

        /* Input */
        .input-wrap{display:flex;align-items:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg);position:relative}
        .input-wrap textarea{flex:1;padding:8px 12px;background:var(--input-bg);color:var(--input-fg);border:1px solid var(--input-border);border-radius:var(--radius);resize:none;font-family:var(--font);font-size:13px;line-height:1.4;min-height:34px;max-height:120px;transition:border-color .12s}
        .input-wrap textarea:focus{outline:none;border-color:var(--focus)}
        .input-wrap textarea::placeholder{color:var(--muted);opacity:0.7}
        .send-btn{padding:8px 16px;background:var(--btn-bg);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-weight:600;font-size:12px;font-family:var(--font);transition:background .12s;white-space:nowrap;height:34px}
        .send-btn:hover{background:var(--btn-hover)}
        .send-btn:disabled{opacity:0.4;cursor:not-allowed}

        /* Command Menu */
        .cmd-menu{position:absolute;bottom:calc(100% + 6px);left:14px;right:14px;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius);max-height:200px;overflow-y:auto;display:none;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
        .cmd-item{padding:8px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .08s}
        .cmd-item:hover,.cmd-item.active{background:rgba(255,255,255,0.05)}
        .cmd-item .ico{width:22px;text-align:center;font-size:14px;flex-shrink:0}
        .cmd-item .cmd{font-weight:600;font-family:var(--mono);font-size:11px}
        .cmd-item .dsc{font-size:11px;color:var(--muted);margin-left:auto}

        .progress{padding:6px 16px;font-size:11px;color:var(--muted);animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:0.5}50%{opacity:1}}
    </style>
</head>
<body>
    <div class="statusbar">
        <span class="dot on" id="dot"></span>
        <span id="modelName">Qwen 1.5B</span>
        <span class="spacer"></span>
        <span id="tokenSpeed"></span>
    </div>

    <div class="content" id="content">
        <div class="dashboard" id="dashboard">
            <h3>CodeForge</h3>
            <div class="dash-cards">
                <div class="dash-card"><div class="lbl">Workspace</div><div class="val" id="wsName">-</div></div>
                <div class="dash-card"><div class="lbl">Model</div><div class="val green" id="dModel">1.5B</div></div>
                <div class="dash-card"><div class="lbl">Status</div><div class="val green" id="dStatus">Connected</div></div>
            </div>
            <div class="quick-actions">
                <button onclick="runCmd('/explain')">Explain Code</button>
                <button onclick="runCmd('/fix')">Fix Bug</button>
                <button onclick="runCmd('/generate')">Generate Code</button>
                <button onclick="runCmd('/test')">Write Tests</button>
                <button onclick="runCmd('/refactor')">Refactor</button>
                <button onclick="runCmd('/docs')">Document</button>
            </div>
        </div>
        <div id="messages"></div>
        <div class="progress" id="progress" style="display:none">Working...</div>
    </div>

    <div class="cmd-menu" id="cmdMenu"></div>

    <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="Type / for commands, @ for files, or ask anything..."></textarea>
        <button class="send-btn" id="sendBtn" onclick="send()">Send</button>
    </div>

    <script>
        var vscode = acquireVsCodeApi();
        var content = document.getElementById('content');
        var messages = document.getElementById('messages');
        var input = document.getElementById('input');
        var sendBtn = document.getElementById('sendBtn');
        var progress = document.getElementById('progress');
        var dashboard = document.getElementById('dashboard');
        var cmdMenu = document.getElementById('cmdMenu');
        var cmds = [
            {cmd:'/explain',ico:'📖',dsc:'Explain code'},
            {cmd:'/fix',ico:'🔧',dsc:'Fix bug'},
            {cmd:'/generate',ico:'⚡',dsc:'Generate code'},
            {cmd:'/test',ico:'🧪',dsc:'Write tests'},
            {cmd:'/docs',ico:'📝',dsc:'Document code'},
            {cmd:'/refactor',ico:'♻️',dsc:'Refactor'},
            {cmd:'/review',ico:'👀',dsc:'Review file'},
            {cmd:'/optimize',ico:'🚀',dsc:'Optimize'}
        ];
        var activeIdx = -1;

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (cmdMenu.style.display === 'block' && activeIdx >= 0) { pickCmd(cmds[activeIdx].cmd); } else { send(); } return; }
            if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, cmds.length - 1); renderCmdMenu(); return; }
            if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); renderCmdMenu(); return; }
            if (e.key === 'Escape') { cmdMenu.style.display = 'none'; activeIdx = -1; return; }
            setTimeout(checkCmd, 10);
        });

        function checkCmd() {
            var val = input.value, pos = input.selectionStart, before = val.substring(0, pos);
            var m = before.match(/\/(\w*)$/);
            if (m) {
                var q = m[1].toLowerCase();
                var filtered = cmds.filter(function(c){return c.cmd.toLowerCase().includes('/'+q);});
                if (filtered.length > 0) { cmds = filtered; activeIdx = 0; renderCmdMenu(); } else { cmdMenu.style.display = 'none'; }
            } else { cmdMenu.style.display = 'none'; activeIdx = -1; }
        }

        function renderCmdMenu() {
            cmdMenu.innerHTML = cmds.map(function(c,i){
                return '<div class="cmd-item'+(i===activeIdx?' active':'')+'" onclick="pickCmd(\''+c.cmd+'\')"><span class="ico">'+c.ico+'</span><span class="cmd">'+c.cmd+'</span><span class="dsc">'+c.dsc+'</span></div>';
            }).join('');
            cmdMenu.style.display = 'block';
        }

        function pickCmd(cmd) {
            var val = input.value, pos = input.selectionStart, before = val.substring(0, pos);
            var idx = before.lastIndexOf('/');
            input.value = before.substring(0, idx) + cmd + ' ' + val.substring(pos);
            cmdMenu.style.display = 'none'; activeIdx = -1; input.focus();
        }

        function runCmd(cmd) { input.value = cmd + ' '; send(); }

        function send() {
            var text = input.value.trim();
            if (!text) return;
            if (dashboard) dashboard.style.display = 'none';
            var d = document.createElement('div'); d.className = 'msg user';
            d.innerHTML = '<span class="q">' + esc(text) + '</span>';
            messages.appendChild(d); content.scrollTop = content.scrollHeight;
            input.value = ''; sendBtn.disabled = true; progress.style.display = 'block';
            vscode.postMessage({command:'sendMessage',text:text});
        }

        window.addEventListener('message', function(e) {
            var m = e.data;
            switch(m.command) {
                case 'addMessage':
                    progress.style.display = 'none'; sendBtn.disabled = false; input.focus();
                    showResponse(m.text); break;
                case 'addArtifact':
                    progress.style.display = 'none'; sendBtn.disabled = false;
                    showArtifact(m.code, m.language, m.title); break;
                case 'responseError':
                    progress.style.display = 'none'; sendBtn.disabled = false;
                    var er = document.createElement('div'); er.className = 'msg error'; er.textContent = m.error;
                    messages.appendChild(er); content.scrollTop = content.scrollHeight; break;
                case 'updateStatus':
                    document.getElementById('modelName').textContent = m.model||'?';
                    document.getElementById('dot').className = 'dot '+(m.connected?'on':'off'); break;
            }
        });

        function showResponse(text) {
            var div = document.createElement('div'); div.className = 'msg';
            var hasCode = text.includes('```');
            var html = '';
            if (hasCode) {
                html += '<div class="sec"><div class="sec-hdr">CODE ▼</div><div class="sec-body">';
                html += text.replace(/```(\w*)\n?([\s\S]*?)```/g, function(_,lang,code){
                    return '<div class="cb"><div class="cb-bar"><span>'+(lang||'text')+'</span><button onclick="cpy(this)">Copy</button></div><pre><code class="language-'+(lang||'text')+'">'+esc(code.trim())+'</code></pre></div>';
                });
                html += '<div class="acts"><button class="pri" onclick="app(this)">Apply</button><button onclick="cpyCode(this)">Copy</button></div></div></div>';
            }
            var expl = text.replace(/```[\s\S]*?```/g,'').replace(/\n{3,}/g,'\n\n').trim();
            if (expl.length > 30) {
                html += '<div class="sec"><div class="sec-hdr" onclick="tgl(this)">EXPLANATION '+(hasCode?'▶':'▼')+'</div>';
                html += '<div class="sec-body'+(hasCode?' hidden':'')+'"><div class="text">'+fmt(expl)+'</div></div></div>';
            }
            if (!hasCode && expl.length <= 30) html += '<div class="text">'+fmt(text)+'</div>';
            html += '<div class="acts">';
            var acts = hasCode ? [{l:'Apply',p:1},{l:'Explain'},{l:'Add Tests'},{l:'Refactor'}] : [{l:'Continue'},{l:'Example'},{l:'More'}];
            acts.forEach(function(a){html += '<button class="'+(a.p?'pri':'')+'" onclick="ask(\''+a.l+'\')">'+a.l+'</button>';});
            html += '</div>';
            div.innerHTML = html; messages.appendChild(div); content.scrollTop = content.scrollHeight;
            div.querySelectorAll('pre code').forEach(function(b){hljs.highlightElement(b);});
        }

        function showArtifact(code, lang, title) {
            var div = document.createElement('div'); div.className = 'msg';
            div.innerHTML = '<div class="sec"><div class="sec-hdr">ARTIFACT: '+esc(title||'Code')+' <span style="opacity:0.6;font-weight:400">'+(lang||'text')+'</span></div><div class="sec-body"><div class="cb"><div class="cb-bar"><span>'+(lang||'text')+'</span><button onclick="cpy(this)">Copy</button></div><pre><code class="language-'+(lang||'text')+'">'+esc(code)+'</code></pre></div><div class="acts"><button class="pri" onclick="app(this)">Apply</button><button onclick="ask(\'Explain\')">Explain</button><button onclick="ask(\'Add Tests\')">Add Tests</button></div></div></div>';
            messages.appendChild(div); content.scrollTop = content.scrollHeight;
            div.querySelectorAll('pre code').forEach(function(b){hljs.highlightElement(b);});
        }

        function tgl(h) { var b = h.nextElementSibling; b.classList.toggle('hidden'); h.textContent = h.textContent.replace(/[▼▶]/,'') + (b.classList.contains('hidden')?'▶':'▼'); }
        function app(b) { vscode.postMessage({command:'applyCode',text:b.closest('.msg').querySelector('code').textContent}); }
        function cpy(b) { navigator.clipboard.writeText(b.closest('.cb').querySelector('code').textContent); b.textContent='Copied!'; setTimeout(function(){b.textContent='Copy';},1500); }
        function cpyCode(b) { navigator.clipboard.writeText(b.closest('.msg').querySelector('code').textContent); b.textContent='Copied!'; setTimeout(function(){b.textContent='Copy';},1500); }
        function ask(t) { input.value = t; send(); }
        function fmt(t) { return t.replace(/`([^`]+)`/g,'<code style="background:var(--code-bg);padding:1px 5px;border-radius:3px;font-size:12px">$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
        function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    </script>
</body>
</html>
