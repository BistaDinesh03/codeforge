<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'unsafe-inline' https://cdnjs.cloudflare.com;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--vscode-font-family);font-size:13px;background:var(--vscode-editor-background,#1e1e1e);color:var(--vscode-editor-foreground,#d4d4d4);height:100vh;display:flex;flex-direction:column}
        .bar{display:flex;align-items:center;gap:8px;padding:0 12px;height:24px;background:var(--vscode-statusBar-background,#007acc);color:#fff;font-size:11px;flex-shrink:0}
        .dot{width:6px;height:6px;border-radius:50%}.dot.on{background:#4ec944}.dot.off{background:#f85149}
        .msgs{flex:1;overflow-y:auto;padding:8px 0}
        .msg{padding:6px 14px;font-size:12px;line-height:1.5;border-bottom:1px solid rgba(128,128,128,0.05)}
        .msg.user{color:var(--vscode-descriptionForeground,#999)}
        .msg.ai{background:rgba(255,255,255,0.01)}
        .msg .lbl{font-size:10px;font-weight:600;text-transform:uppercase;margin-bottom:2px;opacity:0.6}
        .cb{border:1px solid var(--vscode-panel-border,#404040);border-left:3px solid var(--vscode-focusBorder,#1f6feb);border-radius:3px;margin:6px 0;overflow:hidden}
        .cb-top{display:flex;justify-content:space-between;padding:3px 8px;background:rgba(255,255,255,0.03);font-size:10px;color:var(--vscode-descriptionForeground,#999)}
        .cb-top button{background:none;border:1px solid var(--vscode-panel-border,#555);color:var(--vscode-descriptionForeground,#999);padding:1px 6px;border-radius:2px;cursor:pointer;font-size:10px}
        .cb-top button:hover{color:#fff;background:rgba(255,255,255,0.05)}
        .cb pre{margin:0;padding:10px;overflow-x:auto;background:var(--vscode-textCodeBlock-background,#0d1117)}
        .cb code{font-family:var(--vscode-editor-font-family,monospace);font-size:12px;line-height:1.4}
        .acts{display:flex;gap:4px;margin-top:6px}
        .acts button{padding:3px 10px;font-size:11px;background:var(--vscode-button-secondaryBackground,#3c3c3c);color:var(--vscode-editor-foreground,#d4d4d4);border:1px solid var(--vscode-panel-border,#555);border-radius:3px;cursor:pointer}
        .acts button:hover{background:var(--vscode-button-secondaryHoverBackground,#4d4d4d)}
        .acts button.pri{background:var(--vscode-button-background,#0e639c);color:#fff;border:none}
        .input-w{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--vscode-panel-border,#3c3c3c);flex-shrink:0}
        .input-w textarea{flex:1;padding:6px 10px;background:var(--vscode-input-background,#2d2d2d);color:var(--vscode-input-foreground,#fff);border:1px solid var(--vscode-input-border,#555);border-radius:4px;resize:none;font-family:inherit;font-size:12px;min-height:28px;max-height:80px}
        .input-w textarea:focus{outline:none;border-color:var(--vscode-focusBorder,#1f6feb)}
        .input-w button{padding:6px 14px;background:var(--vscode-button-background,#0e639c);color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600;font-size:12px}
        .input-w button:disabled{opacity:0.4}
        .empty{text-align:center;padding:40px;color:var(--vscode-descriptionForeground,#999)}
        .empty b{color:var(--vscode-editor-foreground,#d4d4d4)}
        .hint{margin-top:12px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
        .hint span{padding:3px 8px;font-size:10px;background:var(--vscode-input-background,#2d2d2d);border:1px solid var(--vscode-panel-border,#404040);border-radius:10px;cursor:pointer}
        .hint span:hover{background:var(--vscode-button-background,#0e639c);color:#fff;border-color:#0e639c}
    </style>
</head>
<body>
    <div class="bar"><span class="dot on" id="dot"></span>CodeForge</div>
    <div class="msgs" id="msgs">
        <div class="empty" id="empty"><b>CodeForge</b><p style="margin-top:6px">Your private AI coding assistant</p><div class="hint"><span onclick="ask('/explain')">/explain</span><span onclick="ask('/fix')">/fix</span><span onclick="ask('/generate')">/generate</span><span onclick="ask('/test')">/test</span><span onclick="ask('/refactor')">/refactor</span></div></div>
    </div>
    <div class="input-w"><textarea id="input" rows="1" placeholder="Ask anything... (Enter to send)"></textarea><button id="snd" onclick="send()">Send</button></div>
    <script>
        var vscode = acquireVsCodeApi();
        var msgs = document.getElementById('msgs'), input = document.getElementById('input'), snd = document.getElementById('snd'), empty = document.getElementById('empty');
        input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
        function ask(t){input.value=t;send()}
        function send(){var t=input.value.trim();if(!t)return;if(empty)empty.remove();show(t,'user');input.value='';snd.disabled=true;vscode.postMessage({command:'sendMessage',text:t})}
        function show(text,type){var d=document.createElement('div');d.className='msg '+(type||'ai');
            if(type==='user')d.innerHTML='<div class="lbl">You</div>'+esc(text);
            else if(type==='error')d.innerHTML='<div class="lbl" style="color:#f85149">Error</div><span style="color:#f99">'+esc(text)+'</span>';
            else{var h='<div class="lbl">CodeForge</div>'+md(text);if(text.includes('```'))h+='<div class="acts"><button class="pri" onclick="app(this)">Apply</button><button onclick="cpy(this)">Copy</button><button onclick="ask(\'Explain\')">Explain</button></div>';else h+='<div class="acts"><button onclick="ask(\'Continue\')">Continue</button><button onclick="ask(\'Example\')">Example</button></div>';d.innerHTML=h}
            msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;d.querySelectorAll('pre code').forEach(function(b){hljs.highlightElement(b)})
        }
        function md(t){return t.replace(/```(\w*)\n?([\s\S]*?)```/g,function(_,l,c){return'<div class="cb"><div class="cb-top"><span>'+(l||'text')+'</span><button onclick="c2(this)">Copy</button></div><pre><code class="language-'+(l||'text')+'">'+esc(c.trim())+'</code></pre></div>'}).replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code style="background:var(--vscode-textCodeBlock-background,#0d1117);padding:1px 4px;border-radius:2px;font-size:11px">$1</code>')}
        function app(b){var c=b.closest('.msg').querySelector('code').textContent;vscode.postMessage({command:'applyCode',text:c});vscode.window?.showInformationMessage?.('Applied!')}
        function cpy(b){var c=b.closest('.msg').querySelector('code').textContent;navigator.clipboard.writeText(c);b.textContent='Copied!';setTimeout(function(){b.textContent='Copy'},1500)}
        function c2(b){var c=b.closest('.cb').querySelector('code').textContent;navigator.clipboard.writeText(c);b.textContent='Copied!';setTimeout(function(){b.textContent='Copy'},1500)}
        function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
        window.addEventListener('message',function(e){var m=e.data;snd.disabled=false;input.focus();if(m.command==='addMessage')show(m.text,m.type);if(m.command==='addArtifact')show('```'+(m.language||'')+'\n'+m.code+'\n```','ai');if(m.command==='responseError')show(m.error,'error')});
    </script>
</body>
</html>
