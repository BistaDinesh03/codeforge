<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'unsafe-inline' https://cdnjs.cloudflare.com;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--vscode-font-family);font-size:var(--vscode-font-size,13px);background:var(--vscode-editor-background,#1e1e1e);color:var(--vscode-editor-foreground,#d4d4d4);height:100vh;display:flex;flex-direction:column;overflow:hidden}
        
        /* Compact Status Bar */
        .statusbar{display:flex;align-items:center;gap:12px;padding:4px 12px;background:var(--vscode-statusBar-background,#007acc);color:var(--vscode-statusBar-foreground,#fff);font-size:11px;flex-shrink:0;min-height:24px}
        .statusbar .dot{width:6px;height:6px;border-radius:50%;margin-right:2px}
        .statusbar .dot.on{background:#4ec944}.statusbar .dot.off{background:#f85149}
        .statusbar .sep{opacity:0.4}
        .statusbar .right{margin-left:auto}
        
        /* Content Area */
        .content{flex:1;overflow-y:auto;padding:0}
        
        /* Dashboard (visible when no conversation) */
        .dashboard{padding:12px 14px}
        .dashboard .row{display:flex;gap:12px;margin-bottom:8px;flex-wrap:wrap}
        .dashboard .card{flex:1;min-width:150px;padding:8px 12px;background:var(--vscode-input-background,#2d2d2d);border:1px solid var(--vscode-panel-border,#404040);border-radius:4px}
        .dashboard .card .label{font-size:10px;color:var(--vscode-descriptionForeground,#999);text-transform:uppercase;margin-bottom:3px}
        .dashboard .card .value{font-size:13px;font-weight:500}
        .dashboard .card .value.green{color:#4ec944}
        .dashboard .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
        .dashboard .actions button{padding:4px 10px;font-size:11px;background:var(--vscode-button-secondaryBackground,#3c3c3c);color:var(--vscode-button-secondaryForeground,#ccc);border:1px solid var(--vscode-button-secondaryBorder,#555);border-radius:3px;cursor:pointer}
        .dashboard .actions button:hover{background:var(--vscode-button-secondaryHoverBackground,#4d4d4d)}
        
        /* Messages */
        .msg{padding:8px 14px;border-bottom:1px solid var(--vscode-panel-border,#3c3c3c20)}
        .msg.user{background:var(--vscode-editor-background,#1e1e1e)}
        .msg.ai{background:var(--vscode-input-background,#2d2d2d20)}
        .msg .role{font-size:10px;font-weight:600;text-transform:uppercase;margin-bottom:4px;color:var(--vscode-descriptionForeground,#999)}
        .msg.user .role{color:var(--vscode-button-background,#0e639c)}
        .msg .text{line-height:1.5}
        .msg .text p{margin:2px 0}
        
        /* Structured Response */
        .section{margin:6px 0;border:1px solid var(--vscode-panel-border,#404040);border-radius:4px;overflow:hidden}
        .section-header{padding:5px 10px;background:var(--vscode-titleBar-activeBackground,#252526);font-size:10px;font-weight:600;text-transform:uppercase;color:var(--vscode-descriptionForeground,#999);cursor:pointer;display:flex;justify-content:space-between}
        .section-header:hover{color:var(--vscode-editor-foreground,#ddd)}
        .section-body{padding:8px 10px}
        .section-body.collapsed{display:none}
        
        /* Code blocks */
        .code-block{margin:4px 0;border-radius:3px;overflow:hidden;border:1px solid var(--vscode-panel-border,#404040)}
        .code-block .bar{display:flex;justify-content:space-between;padding:3px 10px;background:var(--vscode-titleBar-activeBackground,#343434);font-size:10px;color:#999}
        .code-block .bar button{background:none;border:1px solid #555;color:#999;padding:1px 6px;border-radius:3px;cursor:pointer;font-size:10px}
        .code-block .bar button:hover{color:#fff;background:#444}
        .code-block pre{margin:0;padding:10px;overflow-x:auto;background:var(--vscode-textCodeBlock-background,#1e1e1e)}
        .code-block code{font-family:var(--vscode-editor-font-family,monospace);font-size:12px;line-height:1.5}
        
        /* Action bar */
        .action-bar{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
        .action-bar button{padding:3px 8px;font-size:11px;background:var(--vscode-button-secondaryBackground,#3c3c3c);color:var(--vscode-button-secondaryForeground,#ccc);border:1px solid var(--vscode-button-secondaryBorder,#555);border-radius:3px;cursor:pointer}
        .action-bar button:hover{background:var(--vscode-button-secondaryHoverBackground,#4d4d4d)}
        .action-bar button.primary{background:var(--vscode-button-background,#0e639c);color:#fff;border:none}
        .action-bar button.primary:hover{background:var(--vscode-button-hoverBackground,#1177bb)}
        
        /* Input */
        .input-area{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--vscode-panel-border,#3c3c3c);flex-shrink:0;background:var(--vscode-editor-background,#1e1e1e)}
        .input-area textarea{flex:1;padding:6px 10px;background:var(--vscode-input-background,#3c3c3c);color:var(--vscode-input-foreground,#fff);border:1px solid var(--vscode-input-border,#555);border-radius:4px;resize:none;font-family:inherit;font-size:13px;min-height:28px;max-height:120px}
        .input-area textarea:focus{outline:none;border-color:var(--vscode-focusBorder,#1f6feb)}
        .input-area button{padding:6px 12px;background:var(--vscode-button-background,#0e639c);color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600;font-size:12px}
        .input-area button:hover{background:var(--vscode-button-hoverBackground,#1177bb)}
        .input-area button:disabled{opacity:0.5}
        
        .context-bar{display:flex;gap:4px;padding:2px 12px;flex-wrap:wrap}
        .context-chip{padding:2px 8px;font-size:10px;background:var(--vscode-badge-background,#4d4d4d);color:var(--vscode-badge-foreground,#fff);border-radius:8px}
        .progress{padding:4px 14px;font-size:11px;color:var(--vscode-descriptionForeground,#999)}
    </style>
</head>
<body>
    <div class="statusbar" id="statusbar">
        <span class="dot on" id="dot"></span><span id="modelName">Qwen 1.5B</span>
        <span class="sep">|</span><span id="fileCount">0 files</span>
        <span class="sep">|</span><span id="chatCount">0 chats</span>
        <span class="right"><span id="tokenSpeed"></span></span>
    </div>
    
    <div class="context-bar" id="contextBar"></div>
    
    <div class="content" id="content">
        <div class="dashboard" id="dashboard">
            <div class="row">
                <div class="card"><div class="label">Workspace</div><div class="value" id="wsName">-</div></div>
                <div class="card"><div class="label">Model</div><div class="value green" id="dModel">Qwen 1.5B</div></div>
                <div class="card"><div class="label">Files Indexed</div><div class="value" id="dFiles">-</div></div>
                <div class="card"><div class="label">Status</div><div class="value green" id="dStatus">Connected</div></div>
            </div>
            <div class="actions">
                <button onclick="ask('/explain selection')">/explain</button>
                <button onclick="ask('/fix selection')">/fix</button>
                <button onclick="ask('/generate')">/generate</button>
                <button onclick="ask('/test')">/test</button>
                <button onclick="ask('/docs')">/docs</button>
                <button onclick="ask('/refactor')">/refactor</button>
            </div>
        </div>
        <div id="messages"></div>
        <div class="progress" id="progress" style="display:none">Processing...</div>
    </div>
    
    <div class="input-area">
        <textarea id="input" rows="1" placeholder="@file /command or ask anything... (Enter to send, Shift+Enter new line)"></textarea>
        <button id="sendBtn" onclick="send()">Send</button>
    </div>
    
    <script>
        var vscode = acquireVsCodeApi();
        var content = document.getElementById('content');
        var messages = document.getElementById('messages');
        var input = document.getElementById('input');
        var sendBtn = document.getElementById('sendBtn');
        var progress = document.getElementById('progress');
        var dashboard = document.getElementById('dashboard');
        var lastResponseDiv = null;

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });

        function ask(text) { input.value = text; send(); }

        function send() {
            var text = input.value.trim();
            if (!text) return;
            dashboard.style.display = 'none';
            addMessage(text, 'user');
            input.value = '';
            sendBtn.disabled = true;
            progress.style.display = 'block';
            progress.textContent = 'Processing...';
            vscode.postMessage({ command: 'sendMessage', text: text });
        }

        window.addEventListener('message', function(event) {
            var msg = event.data;
            switch(msg.command) {
                case 'addMessage':
                    progress.style.display = 'none';
                    sendBtn.disabled = false;
                    input.focus();
                    lastResponseDiv = addMessage(msg.text, msg.type || 'ai');
                    break;
                case 'addArtifact':
                    progress.style.display = 'none';
                    sendBtn.disabled = false;
                    showArtifact(msg.code, msg.language, msg.title);
                    break;
                case 'responseError':
                    progress.style.display = 'none';
                    sendBtn.disabled = false;
                    addMessage(msg.error, 'error');
                    break;
                case 'updateStatus':
                    document.getElementById('modelName').textContent = msg.model || '-';
                    document.getElementById('fileCount').textContent = (msg.files||0) + ' files';
                    document.getElementById('chatCount').textContent = (msg.chats||0) + ' chats';
                    document.getElementById('dot').className = 'dot ' + (msg.connected ? 'on' : 'off');
                    break;
            }
        });

        function addMessage(text, type) {
            var div = document.createElement('div');
            div.className = 'msg ' + (type || 'ai');
            var role = type === 'user' ? 'YOU' : type === 'error' ? 'ERROR' : 'CODEFORGE';
            
            if (type === 'user') {
                div.innerHTML = '<div class="role">'+role+'</div><div class="text">'+esc(text)+'</div>';
            } else if (type === 'error') {
                div.innerHTML = '<div class="role" style="color:#f85149">'+role+'</div><div class="text" style="color:#f99">'+esc(text)+'</div>';
            } else {
                div.innerHTML = '<div class="role">'+role+'</div><div class="text">'+renderResponse(text)+'</div>';
            }

            messages.appendChild(div);
            content.scrollTop = content.scrollHeight;

            div.querySelectorAll('pre code').forEach(function(block) {
                hljs.highlightElement(block);
            });

            return div;
        }

        function renderResponse(text) {
            // Extract sections
            var html = '';
            var lines = text.split('\n');
            var inCode = false, codeBuf = '', codeLang = '';
            
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                
                // Code blocks
                if (line.startsWith('```')) {
                    if (inCode) {
                        html += '<div class="code-block"><div class="bar"><span>'+(codeLang||'text')+'</span><button onclick="copyBlock(this)">Copy</button></div><pre><code class="language-'+(codeLang||'text')+'">'+esc(codeBuf.trim())+'</code></pre></div>';
                        codeBuf = ''; codeLang = '';
                    } else {
                        codeLang = line.slice(3).trim();
                    }
                    inCode = !inCode;
                    continue;
                }
                
                if (inCode) { codeBuf += line + '\n'; continue; }
                
                // Section headers
                if (/^[A-Z][A-Z ]+:$/.test(line.trim())) {
                    var title = line.trim().replace(':', '');
                    html += '<div class="section"><div class="section-header" onclick="toggleSection(this)">'+esc(title)+' <span>▼</span></div><div class="section-body">';
                    continue;
                }
                
                html += '<p>'+esc(line)+'</p>';
            }
            
            html += '</div></div>'; // close any open section
            
            // Action bar
            var hasCode = /```/.test(text);
            var isFix = /fix|bug|error/i.test(text);
            var actions = hasCode ? ['Apply','Diff','Copy','Explain','Add Tests'] :
                          isFix ? ['Apply Fix','Show Diff','Explain'] :
                          ['Continue','Give Example','Explain More'];
            
            html += '<div class="action-bar">';
            actions.forEach(function(a) {
                html += '<button class="'+(a==='Apply'||a==='Apply Fix'?'primary':'')+'" onclick="ask(\''+a+'\')">'+a+'</button>';
            });
            html += '</div>';
            
            return html;
        }

        function showArtifact(code, language, title) {
            var div = document.createElement('div');
            div.className = 'msg ai';
            div.innerHTML = '<div class="role">ARTIFACT</div>' +
                '<div class="code-block"><div class="bar"><span>'+(language||'text')+' - '+esc(title||'Code')+'</span><div><button onclick="applyCode(\''+esc(code)+'\')">Apply</button><button onclick="copyBlock(this)">Copy</button></div></div><pre><code class="language-'+(language||'text')+'">'+esc(code)+'</code></pre></div>' +
                '<div class="action-bar"><button class="primary" onclick="applyCode(\''+esc(code).replace(/'/g,"\\'")+'\')">Apply</button><button onclick="ask(\'Explain this code\')">Explain</button><button onclick="ask(\'Add tests for this\')">Add Tests</button></div>';
            
            messages.appendChild(div);
            content.scrollTop = content.scrollHeight;
            div.querySelectorAll('pre code').forEach(function(b) { hljs.highlightElement(b); });
        }

        function toggleSection(header) {
            var body = header.nextElementSibling;
            body.classList.toggle('collapsed');
            header.querySelector('span').textContent = body.classList.contains('collapsed') ? '▶' : '▼';
        }

        function applyCode(code) {
            vscode.postMessage({ command: 'applyCode', text: code });
        }

        function copyBlock(btn) {
            var code = btn.closest('.code-block').querySelector('code').textContent;
            navigator.clipboard.writeText(code);
            btn.textContent = 'Copied!';
            setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
        }

        function esc(text) {
            return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // Init
        vscode.postMessage({ command: 'getStatus' });
    </script>
</body>
</html>
