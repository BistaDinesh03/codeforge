<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'unsafe-inline' https://cdnjs.cloudflare.com;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--vscode-font-family);font-size:var(--vscode-font-size,13px);background:var(--vscode-editor-background,#1e1e1e);color:var(--vscode-editor-foreground,#d4d4d4);height:100vh;display:flex;flex-direction:column}
        .header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--vscode-titleBar-activeBackground,#252526);border-bottom:1px solid var(--vscode-panel-border,#3c3c3c);font-weight:600;font-size:13px;flex-shrink:0}
        .dot{width:7px;height:7px;border-radius:50%;background:#4ec944}
        #messages{flex:1;overflow-y:auto;padding:12px 0}
        .msg{display:flex;gap:10px;padding:6px 14px;animation:fadeIn .15s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
        .msg.user{flex-direction:row-reverse}
        .msg .avatar{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
        .msg.ai .avatar{background:#1f6feb;color:#fff}.msg.user .avatar{background:#3c3c3c;color:#ccc}
        .msg .body{max-width:88%}
        .msg .bubble{padding:8px 12px;border-radius:8px;line-height:1.55;word-wrap:break-word}
        .msg.ai .bubble{background:var(--vscode-input-background,#2d2d2d);border:1px solid var(--vscode-input-border,#404040)}
        .msg.user .bubble{background:var(--vscode-button-background,#0e639c);color:#fff}
        .msg.error .bubble{background:#5a1d1d;border:1px solid #f85149;color:#ff9999}
        .msg .time{font-size:10px;opacity:0.45;margin-top:2px}.msg.user .time{text-align:right}
        .bubble p{margin:4px 0}.bubble strong{color:var(--vscode-editor-foreground,#e0e0e0)}
        .bubble ul,.bubble ol{padding-left:18px;margin:4px 0}.bubble li{margin:2px 0}
        .code-block{position:relative;margin:8px 0;border-radius:6px;overflow:hidden;border:1px solid var(--vscode-panel-border,#404040)}
        .code-block .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:var(--vscode-titleBar-activeBackground,#343434);font-size:10px;color:#999}
        .code-block .bar button{background:none;border:1px solid #555;color:#999;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:10px}
        .code-block .bar button:hover{color:#fff;background:#444}
        .code-block pre{margin:0;padding:12px;overflow-x:auto;background:var(--vscode-textCodeBlock-background,#1e1e1e)}
        .code-block code{font-family:var(--vscode-editor-font-family,monospace);font-size:12px;line-height:1.5}
        .actions{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
        .actions button{background:transparent;color:var(--vscode-descriptionForeground,#999);border:1px solid var(--vscode-panel-border,#444);padding:3px 10px;border-radius:4px;cursor:pointer;font-size:11px}
        .actions button:hover{color:#fff;border-color:var(--vscode-focusBorder,#1f6feb)}
        .typing{padding:6px 14px;color:var(--vscode-descriptionForeground,#999);font-size:12px;display:flex;align-items:center;gap:8px}
        .dots{display:flex;gap:3px}.dots span{width:5px;height:5px;border-radius:50%;background:#999;animation:bounce 1.4s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
        @keyframes bounce{0%,80%,100%{transform:scale(1);opacity:.3}40%{transform:scale(1.3);opacity:1}}
        #inputArea{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--vscode-panel-border,#3c3c3c);flex-shrink:0}
        #input{flex:1;padding:7px 10px;background:var(--vscode-input-background,#3c3c3c);color:var(--vscode-input-foreground,#fff);border:1px solid var(--vscode-input-border,#555);border-radius:5px;resize:none;font-family:inherit;font-size:13px}
        #input:focus{outline:none;border-color:var(--vscode-focusBorder,#1f6feb)}
        #sendBtn{padding:7px 14px;background:var(--vscode-button-background,#0e639c);color:#fff;border:none;border-radius:5px;cursor:pointer;font-weight:600;font-size:12px}
        #sendBtn:hover{background:var(--vscode-button-hoverBackground,#1177bb)}#sendBtn:disabled{opacity:0.5}
        .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--vscode-descriptionForeground,#999)}
        .welcome h3{font-size:15px;margin-bottom:6px;color:var(--vscode-editor-foreground,#ddd)}
        .welcome .hints{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px;max-width:420px}
        .welcome .hint{padding:5px 12px;font-size:11px;background:var(--vscode-input-background,#2d2d2d);border:1px solid var(--vscode-panel-border,#444);border-radius:14px;cursor:pointer;transition:all .15s}
        .welcome .hint:hover{background:var(--vscode-button-background,#0e639c);color:#fff;border-color:#0e639c}
    </style>
</head>
<body>
    <div class="header"><span class="dot" id="dot"></span>CodeForge</div>
    <div id="messages"><div class="welcome" id="welcome"><h3>Your Private AI Coding Assistant</h3><p>Ask anything about your code</p><div class="hints"><span class="hint" onclick="ask('Explain this code')">Explain code</span><span class="hint" onclick="ask('Write a function to')">Write code</span><span class="hint" onclick="ask('Fix this bug')">Fix bug</span><span class="hint" onclick="ask('Refactor this')">Refactor</span><span class="hint" onclick="ask('How does this work?')">How it works</span><span class="hint" onclick="ask('Generate tests for')">Generate tests</span></div></div></div>
    <div class="typing" id="typing" style="display:none"><div class="dots"><span></span><span></span><span></span></div>AI is thinking</div>
    <div id="inputArea"><textarea id="input" rows="1" placeholder="Ask CodeForge... (Enter to send)"></textarea><button id="sendBtn" onclick="send()">Send</button></div>
    <script>
        var vscode = acquireVsCodeApi();
        var messages = document.getElementById('messages');
        var input = document.getElementById('input');
        var sendBtn = document.getElementById('sendBtn');
        var typing = document.getElementById('typing');
        var welcome = document.getElementById('welcome');
        var dot = document.getElementById('dot');
        var currentAiMsg = null;

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });

        function ask(text) { input.value = text; send(); }

        function send() {
            var text = input.value.trim();
            if (!text) return;
            if (welcome) welcome.remove();
            addMsg(text, 'user');
            input.value = '';
            sendBtn.disabled = true;
            typing.style.display = 'flex';
            currentAiMsg = null;
            dot.className = 'dot';
            vscode.postMessage({ command: 'sendMessage', text: text });
        }

        window.addEventListener('message', function(event) {
            var msg = event.data;
            switch(msg.command) {
                case 'responseStart':
                    typing.style.display = 'flex';
                    currentAiMsg = null;
                    break;
                case 'addMessage':
                    typing.style.display = 'none';
                    sendBtn.disabled = false;
                    input.focus();
                    var el = addMsg(msg.text, msg.type || 'ai');
                    if (msg.type !== 'user') currentAiMsg = el;
                    break;
                case 'responseError':
                    typing.style.display = 'none';
                    sendBtn.disabled = false;
                    addMsg(msg.error || 'Error', 'error');
                    dot.className = 'dot off';
                    break;
            }
        });

        function addMsg(text, type) {
            var div = document.createElement('div');
            div.className = 'msg ' + (type === 'user' ? 'user' : type === 'error' ? 'error' : 'ai');
            var avatar = type === 'user' ? 'U' : 'AI';
            var time = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

            if (type === 'user') {
                div.innerHTML = '<div class="avatar">' + avatar + '</div><div class="body"><div class="bubble">' + esc(text) + '</div><div class="time">' + time + '</div></div>';
            } else if (type === 'error') {
                div.innerHTML = '<div class="body"><div class="bubble">' + esc(text) + '</div></div>';
            } else {
                div.innerHTML = '<div class="avatar">' + avatar + '</div><div class="body"><div class="bubble">' + render(text) + '</div><div class="time">' + time + '</div><div class="actions"><button onclick="copyAll(this)">Copy</button><button onclick="insertCode(this)">Insert</button></div></div>';
            }

            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;

            // Syntax highlight
            div.querySelectorAll('pre code').forEach(function(block) {
                hljs.highlightElement(block);
            });

            return div;
        }

        function render(text) {
            // Code blocks with language
            text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, function(m, lang, code) {
                var l = lang || 'text';
                return '<div class="code-block"><div class="bar"><span>' + l + '</span><button onclick="copyBlock(this)">Copy</button></div><pre><code class="language-' + l + '">' + esc(code.trim()) + '</code></pre></div>';
            });
            // Inline code
            text = text.replace(/`([^`]+)`/g, '<code style="background:var(--vscode-textCodeBlock-background,#333);padding:1px 5px;border-radius:3px;font-size:12px">$1</code>');
            // Bold
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // Headers
            text = text.replace(/^### (.+)$/gm, '<h3 style="font-size:14px;margin:8px 0 4px">$1</h3>');
            text = text.replace(/^## (.+)$/gm, '<h2 style="font-size:15px;margin:8px 0 4px">$1</h2>');
            text = text.replace(/^# (.+)$/gm, '<h1 style="font-size:16px;margin:8px 0 4px">$1</h1>');
            // Lists
            text = text.replace(/^- (.+)$/gm, '<li>$1</li>');
            // Breaks
            text = text.replace(/\n\n/g, '<br>');
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        function esc(text) {
            return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function copyBlock(btn) {
            var code = btn.closest('.code-block').querySelector('code').textContent;
            navigator.clipboard.writeText(code);
            btn.textContent = 'Copied!';
            setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
        }

        function copyAll(btn) {
            var text = btn.closest('.msg').querySelector('.bubble').textContent;
            navigator.clipboard.writeText(text);
            btn.textContent = 'Copied!';
            setTimeout(function() { btn.textContent = 'Copy'; }, 1500);
        }

        function insertCode(btn) {
            var blocks = btn.closest('.msg').querySelectorAll('code');
            var code = '';
            blocks.forEach(function(b) { code += b.textContent + '\n'; });
            vscode.postMessage({ command: 'insertCode', text: code.trim() });
        }
    </script>
</body>
</html>
