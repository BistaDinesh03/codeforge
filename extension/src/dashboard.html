<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://cdnjs.cloudflare.com; script-src 'unsafe-inline' https://cdnjs.cloudflare.com;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--vscode-font-family);font-size:13px;background:var(--vscode-editor-background,#1e1e1e);color:var(--vscode-editor-foreground,#d4d4d4);height:100vh;overflow-y:auto;padding:20px}
        h2{font-size:16px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--vscode-panel-border,#3c3c3c)}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:20px}
        .card{background:var(--vscode-input-background,#2d2d2d);border:1px solid var(--vscode-panel-border,#404040);border-radius:6px;padding:14px}
        .card .lbl{font-size:10px;text-transform:uppercase;color:var(--vscode-descriptionForeground,#999);letter-spacing:.5px;margin-bottom:4px}
        .card .val{font-size:22px;font-weight:600}.card .sub{font-size:11px;color:var(--vscode-descriptionForeground,#999);margin-top:2px}
        .g{color:#3fb950}.y{color:#d29922}.r{color:#f85149}
        .risk-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(128,128,128,.06);font-size:12px}
        .risk-item .sev{font-size:10px;padding:2px 6px;border-radius:8px}.sev.high{background:rgba(248,81,73,.15);color:#f85149}.sev.medium{background:rgba(210,153,34,.15);color:#d29922}
        .persona{border-left:3px solid var(--vscode-focusBorder,#1f6feb);padding:12px;margin:8px 0;background:var(--vscode-input-background,#2d2d2d);border-radius:0 6px 6px 0}
        .persona .name{font-weight:600;font-size:13px}.persona .greet{font-size:12px;margin:4px 0;line-height:1.5;color:var(--vscode-descriptionForeground,#ccc)}
        .persona .meta{font-size:10px;color:var(--vscode-descriptionForeground,#999);margin-top:6px}
        .badge{font-size:10px;padding:2px 8px;background:var(--vscode-badge-background,#4d4d4d);color:var(--vscode-badge-foreground,#fff);border-radius:8px;margin-right:4px}
        .btn{padding:6px 14px;font-size:11px;background:var(--vscode-button-background,#0e639c);color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600;margin-top:10px}
        .btn:hover{background:var(--vscode-button-hoverBackground,#1177bb)}
        .empty{text-align:center;padding:60px;color:var(--vscode-descriptionForeground,#999)}
        .empty h3{font-size:16px;color:var(--vscode-editor-foreground,#d4d4d4);margin-bottom:8px}
        .empty button{margin-top:12px}
    </style>
</head>
<body>
    <div id="content">
        <div class="empty" id="empty">
            <h3>CodeTalk</h3>
            <p>If your code could talk, what would it say?</p>
            <button class="btn" id="analyzeBtn" onclick="analyze()">Analyze Project</button>
        </div>
        <div id="dashboard" style="display:none">
            <h2>Project Health</h2>
            <div class="grid" id="healthGrid"></div>
            <h2>Top Risks</h2>
            <div id="risks"></div>
            <h2>File Personalities</h2>
            <div id="personalities"></div>
            <h2>Awards</h2>
            <div id="awards"></div>
        </div>
    </div>
    <script>
        var vscode = acquireVsCodeApi();
        var empty = document.getElementById('empty');
        var dashboard = document.getElementById('dashboard');

        function analyze() {
            empty.style.display = 'none';
            dashboard.style.display = 'block';
            dashboard.innerHTML = '<p style="color:var(--vscode-descriptionForeground,#999)">Analyzing project...</p>';
            vscode.postMessage({command:'analyze'});
        }

        window.addEventListener('message', function(e) {
            var d = e.data;
            if (d.command === 'analysis') renderDashboard(d.data);
        });

        function renderDashboard(data) {
            var h = '';
            // Health scores
            var health = data.health || {};
            h += '<h2>Project Health</h2><div class="grid">';
            [
                {k:'architecture',l:'Architecture'},{k:'maintainability',l:'Maintainability'},
                {k:'complexity',l:'Complexity'},{k:'documentation',l:'Documentation'},
                {k:'testing',l:'Testing'},{k:'security',l:'Security'},{k:'overall',l:'Overall'}
            ].forEach(function(s){
                var v = health[s.k] || 0;
                var c = v >= 80 ? 'g' : v >= 60 ? 'y' : 'r';
                var t = v >= 80 ? 'Good' : v >= 60 ? 'Okay' : 'Needs work';
                h += '<div class="card"><div class="lbl">'+s.l+'</div><div class="val '+c+'">'+v+'/100</div><div class="sub '+c+'">'+t+'</div></div>';
            });
            h += '</div>';

            // Risks
            if (data.risks && data.risks.length > 0) {
                h += '<h2>Top Risks</h2>';
                data.risks.forEach(function(r){
                    h += '<div class="risk-item"><span class="sev '+r.severity+'">'+r.severity.toUpperCase()+'</span><span>'+r.detail+' <span class="badge">'+r.file+'</span></span></div>';
                });
            }

            // Personalities
            if (data.personalities && data.personalities.length > 0) {
                h += '<h2>File Personalities</h2>';
                data.personalities.forEach(function(p){
                    h += '<div class="persona"><div class="name">'+p.personality+'</div><div class="greet">'+p.greeting+'</div><div class="meta"><span class="badge">'+p.file+'</span> '+p.metrics.lines+' lines | '+p.metrics.functions+' functions | '+p.metrics.todos+' TODOs</div></div>';
                });
            }

            // Awards
            if (data.awards && data.awards.length > 0) {
                h += '<h2>Awards</h2>';
                data.awards.forEach(function(a){
                    h += '<div class="card" style="margin:6px 0"><div class="val" style="font-size:14px">'+a.award+'</div><div class="sub">'+a.detail+'</div></div>';
                });
            }

            h += '<p style="margin-top:10px;font-size:11px;color:var(--vscode-descriptionForeground,#999)">'+data.files+' files | '+data.total_lines+' lines | '+data.total_functions+' functions</p>';
            dashboard.innerHTML = h;
        }
    </script>
</body>
</html>
